[project]
name = "personal-ai-twin-api"
version = "0.1.0"
description = "Personal AI Twin — FastAPI backend"
# `readme` intentionally omitted: modern setuptools refuses paths outside the
# project directory (apps/api/), so the repo-root README.md cannot be used
# here. See docs/architecture/system-overview.md for the authoritative repo
# layout; the top-level README is the entry point for humans.
requires-python = ">=3.11"
authors = [{ name = "Personal AI Twin" }]
license = { text = "TBD" }

# Lower bounds are what the code needs; upper bounds stop a new major from
# arriving unreviewed. Exact, tested versions live in constraints.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    # Token verification. Replaces python-jose (unfixed CVE-2026-85394, and an
    # ecdsa dependency with an unfixed timing side channel).
    "pyjwt[crypto]>=2.9,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1",
    "pgvector>=0.3,<1",
]

[project.optional-dependencies]
# 2.x sends API version 2026-10-21 and no longer accepts sampling parameters;
# app/llm/providers/anthropic.py is written against that surface.
anthropic = ["anthropic>=2.0,<3"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a real PostgreSQL backend (set PAT_TEST_PG_DSN to a postgresql+asyncpg:// DSN); skipped otherwise. Covers advisory-lock seq ordering, the out-of-order-commit scenario, and the migration boundary, which SQLite cannot exercise.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
