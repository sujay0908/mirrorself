name: mobile

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/shared-types/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared-types/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pat/shared-types typecheck
      - run: pnpm --filter @pat/mobile typecheck
      - run: pnpm --filter @pat/mobile test
