name: api

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Test
        env:
          APP_ENV: test
          LLM_PROVIDER: mock
          LLM_MODEL: mock-echo
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q
