# Render Blueprint for the MirrorSelf AI backend.
#
# Deploys the FastAPI service from the existing production Dockerfile. Auth
# stays on Supabase; only application data lives in DATABASE_URL.
#
# NO `databases:` BLOCK ON PURPOSE.
# Render's free Postgres expires 30 days after creation; after a 14-day grace
# period Render deletes the database and all of its data, and it has no
# backups. Twin memories are the product, so they must not sit on storage with
# a deletion date. DATABASE_URL is therefore supplied as a secret pointing at a
# persistent Postgres with pgvector — Neon's free plan ("None of these limits
# delete your data") or a paid Render Postgres instance, which can be added
# here later once it is a paid plan.
#
# No secret is stored in this file: every `sync: false` value is entered once
# in the Render dashboard.
services:
  - type: web
    name: mirrorself-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /v1/health
    # Migrations run before the server binds. `alembic upgrade head` is
    # idempotent, so a restart or a free-tier cold start is a no-op once the
    # schema is current. Keep `exec` so uvicorn stays PID 1 for signals.
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      # A persistent PostgreSQL URL with pgvector available. app.config
      # normalises `postgres://…?sslmode=require` to postgresql+asyncpg, so the
      # provider's connection string can be pasted verbatim.
      - key: DATABASE_URL
        sync: false
      # Supabase remains the identity provider; the API only reads its JWKS.
      - key: SUPABASE_JWT_JWKS_URL
        value: https://ihygwqrqkvkwlpzjrhdg.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-4-5-20250929
      # Startup aborts without this: a dev-only provider is rejected in prod.
      - key: ANTHROPIC_API_KEY
        sync: false
      # `mock` degrades semantic memory retrieval and is warned about at
      # startup. Switch to `openai` once OPENAI_API_KEY is set.
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      # Every browser origin the API is called from. The deployed frontend is
      # served from the Vercel production alias today and will also answer on
      # the custom domain once it is moved; a missing origin here is a CORS
      # rejection on every request, not a visible server error.
      - key: CORS_ALLOW_ORIGINS
        value: https://mirrorself-web.vercel.app,https://timeismetime.com
